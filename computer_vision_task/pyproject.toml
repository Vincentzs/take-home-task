[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline"
version = "0.1.0"
description = "P&ID-to-graph + SOP cross-reference pipeline"
requires-python = ">=3.12"
dependencies = [
    "easyocr>=1.7.2",
    "opencv-python>=4.10",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "networkx>=3.3",
    "Pillow>=10.4",
    "numpy>=1.26,<2.2",
    "pydot>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "types-Pillow",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RET", "PTH", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pipeline", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["easyocr.*", "cv2.*", "pypdfium2.*", "docx.*", "networkx.*", "pydot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: integration tests that load OCR models / process the real PDF",
]

[tool.coverage.run]
source = ["src/pipeline"]
omit = ["*/cli.py", "*/runner.py", "*/visualizer.py", "*/pdf_loader.py", "*/preprocess.py", "*/ocr.py"]
